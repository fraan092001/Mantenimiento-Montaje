<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento - V13 (Carga Masiva Excel)</title>
    
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .bg-app-dark { background-color: #0f172a; }
        .bg-card-dark { background-color: #1e293b; }
    </style>
</head>
<body class="bg-app-dark text-gray-100 font-sans antialiased h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://qlrjvrktlomdqhcnhlaw.supabase.co';
        const supabaseKey = 'sb_publishable_JjwIViAhKNr-7tzhPpW2Jg_xVGHO0-t';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function App() {
            const [tabActiva, setTabActiva] = useState('config'); 
            const [subTabConfig, setSubTabConfig] = useState('excel'); // personal | excel
            
            // Estados para Personal
            const [personalDB, setPersonalDB] = useState([]);
            const [editandoId, setEditandoId] = useState(null);
            const [nuevoNombre, setNuevoNombre] = useState('');
            const [nuevoIngreso, setNuevoIngreso] = useState('06:00');
            const [nuevoEgreso, setNuevoEgreso] = useState('14:18');

            // Estados para Excel / Tareas
            const [textoExcel, setTextoExcel] = useState('');
            const [tareasDB, setTareasDB] = useState([]);
            const [mensajeExito, setMensajeExito] = useState('');

            useEffect(() => {
                obtenerPersonal();
                obtenerTareas();
            }, []);

            const mostrarMensaje = (texto) => {
                setMensajeExito(texto);
                setTimeout(() => setMensajeExito(''), 4000);
            };

            // ==========================================
            // LOGICA: PERSONAL
            // ==========================================
            const obtenerPersonal = async () => {
                const { data } = await supabase.from('personal').select('*').order('nombre_completo', { ascending: true });
                if (data) setPersonalDB(data);
            };

            const guardarPersonal = async (e) => {
                e.preventDefault();
                if (editandoId) {
                    await supabase.from('personal').update({ nombre_completo: nuevoNombre, hora_ingreso: nuevoIngreso, hora_salida: nuevoEgreso }).eq('id', editandoId);
                } else {
                    await supabase.from('personal').insert([{ nombre_completo: nuevoNombre, hora_ingreso: nuevoIngreso, hora_salida: nuevoEgreso }]);
                }
                cancelarEdicion();
                obtenerPersonal();
            };

            const iniciarEdicion = (p) => {
                setEditandoId(p.id);
                setNuevoNombre(p.nombre_completo);
                setNuevoIngreso(p.hora_ingreso.slice(0,5));
                setNuevoEgreso(p.hora_salida.slice(0,5));
            };

            const cancelarEdicion = () => {
                setEditandoId(null);
                setNuevoNombre('');
                setNuevoIngreso('06:00');
                setNuevoEgreso('14:18');
            };

            const alternarEstadoActivo = async (id, estadoActual) => {
                await supabase.from('personal').update({ activo: !estadoActual }).eq('id', id);
                obtenerPersonal();
            };

            // ==========================================
            // LOGICA: TAREAS (EXCEL)
            // ==========================================
            const obtenerTareas = async () => {
                // Asumimos que guardamos todo en tareas_maestras por ahora
                const { data } = await supabase.from('tareas_maestras').select('*').order('id', { ascending: false }).limit(50);
                if (data) setTareasDB(data);
            };

            const procesarExcel = async () => {
                if (!textoExcel.trim()) return;

                // Excel separa las columnas copiadas con tabulaciones (\t) y las filas con saltos de línea (\n)
                const filas = textoExcel.split('\n').filter(f => f.trim() !== '');
                const registrosNuevos = [];

                filas.forEach(fila => {
                    const columnas = fila.split('\t');
                    // Verificamos tener al menos las columnas clave (índice 0: Máquina, índice 1: Orden, índice 4: Duración, índice 6: Operarios)
                    if (columnas.length >= 7) {
                        registrosNuevos.push({
                            maquina: columnas[0].trim(),
                            descripcion: columnas[1].trim(),
                            duracion_minutos: parseInt(columnas[4]) || 0,
                            operarios_req: parseInt(columnas[6]) || 1
                        });
                    }
                });

                if (registrosNuevos.length > 0) {
                    const { error } = await supabase.from('tareas_maestras').insert(registrosNuevos);
                    if (error) {
                        alert('Error al guardar en BD. Asegúrate de tener las columnas: maquina, descripcion, duracion_minutos, operarios_req en la tabla tareas_maestras.\n\nDetalle: ' + error.message);
                    } else {
                        setTextoExcel('');
                        mostrarMensaje(`¡Se procesaron y guardaron ${registrosNuevos.length} preventivos con éxito!`);
                        obtenerTareas();
                    }
                } else {
                    alert('No se detectaron las 8 columnas requeridas. Asegúrate de copiar el formato correcto del Excel.');
                }
            };

            const eliminarTarea = async (id) => {
                if(window.confirm('¿Eliminar este preventivo de la base de datos?')) {
                    await supabase.from('tareas_maestras').delete().eq('id', id);
                    obtenerTareas();
                }
            };

            // ==========================================
            // RENDER VISUAL
            // ==========================================
            return (
                <div class="flex h-full">
                    {/* SIDEBAR */}
                    <div class="w-16 md:w-64 bg-card-dark border-r border-gray-800 flex flex-col z-20 shadow-xl">
                        <div class="p-4 md:p-6 border-b border-gray-800 text-center md:text-left">
                            <h1 class="text-xl font-bold text-white tracking-wider hidden md:block">
                                <i class="fas fa-cogs text-blue-500 mr-2"></i>Mantenimiento
                            </h1>
                            <i class="fas fa-cogs text-blue-500 text-xl md:hidden"></i>
                        </div>
                        <nav class="p-2 md:p-4 space-y-2 flex-1">
                            <button onClick={() => setTabActiva('config')} class={`w-full flex items-center justify-center md:justify-start p-3 rounded font-semibold transition ${tabActiva === 'config' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:bg-gray-800'}`}>
                                <i class="fas fa-database md:mr-3"></i> <span class="hidden md:inline">Base de Datos</span>
                            </button>
                            <button onClick={() => setTabActiva('dashboard')} class={`w-full flex items-center justify-center md:justify-start p-3 rounded transition ${tabActiva === 'dashboard' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:bg-gray-800'}`}>
                                <i class="fas fa-chart-line md:mr-3"></i> <span class="hidden md:inline">Dashboard Gerencial</span>
                            </button>
                        </nav>
                    </div>

                    {/* MAIN CONTENT */}
                    <div class="flex-1 flex flex-col overflow-hidden bg-app-dark relative">
                        {mensajeExito && (
                            <div class="absolute top-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg flex items-center z-50">
                                <i class="fas fa-check-circle mr-2"></i> {mensajeExito}
                            </div>
                        )}

                        {tabActiva === 'config' ? (
                            <div class="flex-1 flex flex-col h-full">
                                {/* PESTAÑAS INTERNAS */}
                                <div class="bg-gray-900 border-b border-gray-800 p-4 flex gap-4">
                                    <button onClick={() => setSubTabConfig('personal')} class={`px-4 py-2 rounded text-sm font-bold transition ${subTabConfig === 'personal' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'}`}>Personal / Técnicos</button>
                                    <button onClick={() => setSubTabConfig('excel')} class={`px-4 py-2 rounded text-sm font-bold transition ${subTabConfig === 'excel' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'}`}>Carga Masiva Excel</button>
                                </div>
                                
                                <div class="p-6 overflow-y-auto flex-1">
                                    {subTabConfig === 'personal' && (
                                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            {/* (El formulario de personal se mantiene igual que en V12) */}
                                            <div class="bg-card-dark rounded-xl border border-gray-700 shadow-xl p-6 h-max">
                                                <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2">
                                                    {editandoId ? <span class="text-yellow-400"><i class="fas fa-edit mr-2"></i>Editar Operario</span> : <span><i class="fas fa-user-plus text-blue-400 mr-2"></i>Alta de Personal</span>}
                                                </h3>
                                                <form onSubmit={guardarPersonal} class="space-y-4">
                                                    <div>
                                                        <label class="block text-xs text-gray-400 mb-1">Apellido y Nombre</label>
                                                        <input type="text" required value={nuevoNombre} onChange={e => setNuevoNombre(e.target.value)} class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-white" placeholder="Ej: Silva, M." />
                                                    </div>
                                                    <div class="flex gap-4">
                                                        <div class="w-1/2">
                                                            <label class="block text-xs text-gray-400 mb-1">Ingreso</label>
                                                            <input type="time" required value={nuevoIngreso} onChange={e => setNuevoIngreso(e.target.value)} class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-white" />
                                                        </div>
                                                        <div class="w-1/2">
                                                            <label class="block text-xs text-gray-400 mb-1">Salida</label>
                                                            <input type="time" required value={nuevoEgreso} onChange={e => setNuevoEgreso(e.target.value)} class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-white" />
                                                        </div>
                                                    </div>
                                                    <div class="flex gap-2 mt-2">
                                                        <button type="submit" class={`flex-1 font-bold py-2 px-4 rounded transition shadow-lg text-white ${editandoId ? 'bg-yellow-600 hover:bg-yellow-500' : 'bg-blue-600 hover:bg-blue-500'}`}>
                                                            {editandoId ? 'Actualizar Datos' : 'Guardar en Servidor'}
                                                        </button>
                                                        {editandoId && (
                                                            <button type="button" onClick={cancelarEdicion} class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded transition"><i class="fas fa-times"></i></button>
                                                        )}
                                                    </div>
                                                </form>
                                            </div>

                                            <div class="lg:col-span-2 bg-card-dark rounded-xl border border-gray-700 shadow-xl p-6">
                                                <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2 flex justify-between items-center">
                                                    <span><i class="fas fa-users text-green-400 mr-2"></i> Plantilla Activa</span>
                                                    <button onClick={obtenerPersonal} class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-gray-300"><i class="fas fa-sync-alt"></i></button>
                                                </h3>
                                                <div class="overflow-x-auto">
                                                    <table class="w-full text-left text-sm text-gray-300">
                                                        <thead class="text-xs text-gray-400 uppercase bg-gray-800 border-b border-gray-700">
                                                            <tr><th class="px-4 py-3">Técnico</th><th class="px-4 py-3">Horario</th><th class="px-4 py-3">Estado</th><th class="px-4 py-3 text-right">Acciones</th></tr>
                                                        </thead>
                                                        <tbody>
                                                            {personalDB.map(p => (
                                                                <tr key={p.id} class={`border-b border-gray-700 hover:bg-gray-800 transition ${!p.activo ? 'opacity-50' : ''}`}>
                                                                    <td class="px-4 py-3 font-medium text-white">{p.nombre_completo}</td>
                                                                    <td class="px-4 py-3 font-mono text-xs">{p.hora_ingreso.slice(0,5)} a {p.hora_salida.slice(0,5)}</td>
                                                                    <td class="px-4 py-3">
                                                                        <button onClick={() => alternarEstadoActivo(p.id, p.activo)} class={`text-xs px-2 py-1 rounded font-bold ${p.activo ? 'bg-green-900 text-green-400' : 'bg-red-900 text-red-400'}`}>
                                                                            {p.activo ? 'Activo' : 'Inactivo'}
                                                                        </button>
                                                                    </td>
                                                                    <td class="px-4 py-3 text-right">
                                                                        <button onClick={() => iniciarEdicion(p)} class="text-blue-400 hover:text-blue-300 transition" title="Editar"><i class="fas fa-edit"></i></button>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {subTabConfig === 'excel' && (
                                        <div class="max-w-6xl mx-auto space-y-6">
                                            {/* CUADRO DE TEXTAREA */}
                                            <div class="bg-card-dark rounded-xl border border-gray-700 shadow-xl p-6">
                                                <h3 class="text-lg font-bold text-white mb-2 flex items-center">
                                                    <i class="fas fa-file-excel text-green-500 mr-2"></i> Carga Masiva desde Excel
                                                </h3>
                                                <p class="text-gray-400 text-sm mb-4">Pega aquí directamente las celdas copiadas de tu Excel. El sistema espera las 8 columnas solicitadas.</p>
                                                
                                                <textarea 
                                                    value={textoExcel}
                                                    onChange={e => setTextoExcel(e.target.value)}
                                                    class="w-full bg-app-dark border border-gray-600 rounded p-4 text-sm text-gray-300 font-mono focus:border-blue-500 focus:outline-none mb-4 h-32 resize-y"
                                                    placeholder="Descripción Máquina | Descripción Orden | Trabajo Anual | UM | Duración Normal | UM | Operarios | Período..."
                                                ></textarea>
                                                
                                                <div>
                                                    <button onClick={procesarExcel} class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded shadow transition border border-gray-600">
                                                        Procesar Datos
                                                    </button>
                                                </div>
                                            </div>

                                            {/* TABLA INFERIOR */}
                                            <div class="bg-card-dark rounded-xl border border-gray-700 shadow-xl overflow-hidden">
                                                <div class="overflow-x-auto">
                                                    <table class="w-full text-left text-sm text-gray-300">
                                                        <thead class="text-xs text-gray-400 uppercase bg-gray-800 border-b border-gray-700">
                                                            <tr>
                                                                <th class="px-6 py-4">Máquina</th>
                                                                <th class="px-6 py-4">Tarea Preventiva</th>
                                                                <th class="px-6 py-4 text-center">Duración (min)</th>
                                                                <th class="px-6 py-4 text-center">Operarios</th>
                                                                <th class="px-6 py-4 text-right">Acciones</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {tareasDB.length === 0 ? (
                                                                <tr>
                                                                    <td colSpan="5" class="px-6 py-8 text-center text-gray-500">
                                                                        No hay preventivos cargados. Pega los datos arriba para comenzar.
                                                                    </td>
                                                                </tr>
                                                            ) : (
                                                                tareasDB.map(t => (
                                                                    <tr key={t.id} class="border-b border-gray-700 hover:bg-gray-800 transition">
                                                                        <td class="px-6 py-3 font-medium text-white">{t.maquina || 'N/A'}</td>
                                                                        <td class="px-6 py-3">{t.descripcion || 'N/A'}</td>
                                                                        <td class="px-6 py-3 text-center">{t.duracion_minutos || '-'}</td>
                                                                        <td class="px-6 py-3 text-center">{t.operarios_req || '-'}</td>
                                                                        <td class="px-6 py-3 text-right">
                                                                            <button onClick={() => eliminarTarea(t.id)} class="text-blue-400 hover:text-blue-300 transition" title="Editar">
                                                                                <i class="fas fa-edit mr-3"></i>
                                                                            </button>
                                                                            <button onClick={() => eliminarTarea(t.id)} class="text-red-400 hover:text-red-300 transition" title="Eliminar">
                                                                                <i class="fas fa-trash"></i>
                                                                            </button>
                                                                        </td>
                                                                    </tr>
                                                                ))
                                                            )}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div class="p-6 h-full flex flex-col items-center justify-center text-center text-gray-500">
                                <i class="fas fa-chart-pie text-6xl mb-4 text-gray-600"></i>
                                <h2 class="text-2xl font-bold text-gray-300">Motor de Saturación (En desarrollo)</h2>
                                <p class="mt-2 text-sm max-w-md">Una vez que cargues el personal, las máquinas y las tareas, programaremos aquí el cruce de datos para visualizar el porcentaje de ocupación gerencial.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
