<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento - V12 (Edición y Carga Masiva)</title>
    
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <!-- LIBRERÍA OFICIAL DE SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .bg-app-dark { background-color: #0f172a; }
        .bg-card-dark { background-color: #1e293b; }
    </style>
</head>
<body class="bg-app-dark text-gray-100 font-sans antialiased h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://qlrjvrktlomdqhcnhlaw.supabase.co';
        const supabaseKey = 'sb_publishable_JjwIViAhKNr-7tzhPpW2Jg_xVGHO0-t';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function App() {
            const [tabActiva, setTabActiva] = useState('config'); 
            const [subTabConfig, setSubTabConfig] = useState('personal'); // personal | maquinas | tareas
            
            // Estados para Personal
            const [personalDB, setPersonalDB] = useState([]);
            const [cargando, setCargando] = useState(true);
            const [editandoId, setEditandoId] = useState(null);
            
            // Formularios
            const [nuevoNombre, setNuevoNombre] = useState('');
            const [nuevoIngreso, setNuevoIngreso] = useState('06:00');
            const [nuevoEgreso, setNuevoEgreso] = useState('14:18');

            // Estados para Carga Masiva (Máquinas y Tareas)
            const [textoMaquinas, setTextoMaquinas] = useState('');
            const [textoTareas, setTextoTareas] = useState('');
            const [mensajeExito, setMensajeExito] = useState('');

            useEffect(() => {
                obtenerPersonal();
            }, []);

            // ==========================================
            // LOGICA: PERSONAL
            // ==========================================
            const obtenerPersonal = async () => {
                setCargando(true);
                const { data, error } = await supabase.from('personal').select('*').order('nombre_completo', { ascending: true });
                if (!error) setPersonalDB(data);
                setCargando(false);
            };

            const guardarPersonal = async (e) => {
                e.preventDefault();
                if (editandoId) {
                    // MODO EDICIÓN
                    const { error } = await supabase.from('personal')
                        .update({ nombre_completo: nuevoNombre, hora_ingreso: nuevoIngreso, hora_salida: nuevoEgreso })
                        .eq('id', editandoId);
                    if (!error) cancelarEdicion();
                } else {
                    // MODO NUEVO
                    const { error } = await supabase.from('personal')
                        .insert([{ nombre_completo: nuevoNombre, hora_ingreso: nuevoIngreso, hora_salida: nuevoEgreso }]);
                    if (!error) cancelarEdicion();
                }
                obtenerPersonal();
            };

            const iniciarEdicion = (p) => {
                setEditandoId(p.id);
                setNuevoNombre(p.nombre_completo);
                setNuevoIngreso(p.hora_ingreso.slice(0,5));
                setNuevoEgreso(p.hora_salida.slice(0,5));
            };

            const cancelarEdicion = () => {
                setEditandoId(null);
                setNuevoNombre('');
                setNuevoIngreso('06:00');
                setNuevoEgreso('14:18');
            };

            const alternarEstadoActivo = async (id, estadoActual) => {
                const { error } = await supabase.from('personal').update({ activo: !estadoActual }).eq('id', id);
                if (!error) obtenerPersonal();
            };

            // ==========================================
            // LOGICA: CARGA MASIVA MÁQUINAS Y TAREAS
            // ==========================================
            const guardarMaquinasMasivas = async (e) => {
                e.preventDefault();
                // Separa el texto por saltos de línea, quita espacios extra y elimina líneas vacías
                const lineas = textoMaquinas.split('\n').map(l => l.trim()).filter(l => l !== '');
                if(lineas.length === 0) return;

                // Asumo que en Supabase la columna se llama "nombre" para la tabla maquinas
                const registros = lineas.map(nombre => ({ nombre: nombre }));
                
                const { error } = await supabase.from('maquinas').insert(registros);
                if (error) {
                    alert('Error al guardar máquinas. Verifica que la columna en Supabase se llame "nombre". ' + error.message);
                } else {
                    setTextoMaquinas('');
                    mostrarMensaje(`¡${lineas.length} máquinas guardadas con éxito!`);
                }
            };

            const guardarTareasMasivas = async (e) => {
                e.preventDefault();
                const lineas = textoTareas.split('\n').map(l => l.trim()).filter(l => l !== '');
                if(lineas.length === 0) return;

                // Asumo que la columna se llama "descripcion" para tareas_maestras
                const registros = lineas.map(desc => ({ descripcion: desc }));
                
                const { error } = await supabase.from('tareas_maestras').insert(registros);
                if (error) {
                    alert('Error al guardar tareas. Verifica que la columna en Supabase se llame "descripcion". ' + error.message);
                } else {
                    setTextoTareas('');
                    mostrarMensaje(`¡${lineas.length} tareas guardadas con éxito!`);
                }
            };

            const mostrarMensaje = (texto) => {
                setMensajeExito(texto);
                setTimeout(() => setMensajeExito(''), 3000);
            };

            // ==========================================
            // RENDER: PESTAÑAS DE CONFIGURACIÓN
            // ==========================================
            const renderSeccionPersonal = () => (
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* FORMULARIO */}
                    <div class="bg-card-dark rounded-xl border border-gray-700 shadow-xl p-6 h-max">
                        <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2">
                            {editandoId ? <span class="text-yellow-400"><i class="fas fa-edit mr-2"></i>Editar Operario</span> : <span><i class="fas fa-user-plus text-blue-400 mr-2"></i>Alta de Personal</span>}
                        </h3>
                        <form onSubmit={guardarPersonal} class="space-y-4">
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">Apellido y Nombre</label>
                                <input type="text" required value={nuevoNombre} onChange={e => setNuevoNombre(e.target.value)}
                                    class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-white" 
                                    placeholder="Ej: Silva, M." />
                            </div>
                            <div class="flex gap-4">
                                <div class="w-1/2">
                                    <label class="block text-xs text-gray-400 mb-1">Ingreso</label>
                                    <input type="time" required value={nuevoIngreso} onChange={e => setNuevoIngreso(e.target.value)}
                                        class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-white" />
                                </div>
                                <div class="w-1/2">
                                    <label class="block text-xs text-gray-400 mb-1">Salida</label>
                                    <input type="time" required value={nuevoEgreso} onChange={e => setNuevoEgreso(e.target.value)}
                                        class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-white" />
                                </div>
                            </div>
                            <div class="flex gap-2 mt-2">
                                <button type="submit" class={`flex-1 font-bold py-2 px-4 rounded transition shadow-lg text-white ${editandoId ? 'bg-yellow-600 hover:bg-yellow-500' : 'bg-blue-600 hover:bg-blue-500'}`}>
                                    {editandoId ? 'Actualizar Datos' : 'Guardar en Servidor'}
                                </button>
                                {editandoId && (
                                    <button type="button" onClick={cancelarEdicion} class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded transition">
                                        <i class="fas fa-times"></i>
                                    </button>
                                )}
                            </div>
                        </form>
                    </div>

                    {/* TABLA DE PERSONAL */}
                    <div class="lg:col-span-2 bg-card-dark rounded-xl border border-gray-700 shadow-xl p-6">
                        <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2 flex justify-between items-center">
                            <span><i class="fas fa-users text-green-400 mr-2"></i> Plantilla</span>
                            <button onClick={obtenerPersonal} class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-gray-300">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-gray-300">
                                <thead class="text-xs text-gray-400 uppercase bg-gray-800 border-b border-gray-700">
                                    <tr>
                                        <th class="px-4 py-3">Técnico</th>
                                        <th class="px-4 py-3">Horario</th>
                                        <th class="px-4 py-3">Estado</th>
                                        <th class="px-4 py-3 text-right">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {personalDB.map(p => (
                                        <tr key={p.id} class={`border-b border-gray-700 hover:bg-gray-800 transition ${!p.activo ? 'opacity-50' : ''}`}>
                                            <td class="px-4 py-3 font-medium text-white">{p.nombre_completo}</td>
                                            <td class="px-4 py-3 font-mono text-xs">{p.hora_ingreso.slice(0,5)} a {p.hora_salida.slice(0,5)}</td>
                                            <td class="px-4 py-3">
                                                <button onClick={() => alternarEstadoActivo(p.id, p.activo)} class={`text-xs px-2 py-1 rounded font-bold ${p.activo ? 'bg-green-900 text-green-400' : 'bg-red-900 text-red-400'}`}>
                                                    {p.activo ? 'Activo' : 'Inactivo'}
                                                </button>
                                            </td>
                                            <td class="px-4 py-3 text-right space-x-3">
                                                <button onClick={() => iniciarEdicion(p)} class="text-yellow-400 hover:text-yellow-300 transition" title="Editar datos">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            const renderSeccionCargaMasiva = (titulo, icono, placeholder, texto, setTexto, guardarFunc) => (
                <div class="bg-card-dark rounded-xl border border-gray-700 shadow-xl p-6 max-w-3xl mx-auto">
                    <h3 class="text-xl font-bold text-white mb-2"><i class={`fas ${icono} text-blue-400 mr-2`}></i> Carga Masiva: {titulo}</h3>
                    <p class="text-gray-400 text-sm mb-4">Copia una columna desde Excel y pégala aquí. Cada renglón se guardará como un registro independiente en la base de datos.</p>
                    
                    <form onSubmit={guardarFunc}>
                        <textarea 
                            value={texto} 
                            onChange={e => setTexto(e.target.value)}
                            class="w-full h-64 bg-gray-800 border border-gray-600 rounded p-4 text-sm text-white font-mono focus:border-blue-500 focus:outline-none mb-4"
                            placeholder={placeholder}
                            required
                        ></textarea>
                        
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-gray-500">Líneas detectadas: {texto.split('\n').filter(l=>l.trim()!=='').length}</span>
                            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded shadow-lg transition">
                                Guardar en Servidor
                            </button>
                        </div>
                    </form>
                </div>
            );

            // ==========================================
            // RUTA PRINCIPAL (RENDER)
            // ==========================================
            return (
                <div class="flex h-full">
                    {/* SIDEBAR PRINCIPAL */}
                    <div class="w-16 md:w-64 bg-card-dark border-r border-gray-800 flex flex-col z-20 shadow-xl">
                        <div class="p-4 md:p-6 border-b border-gray-800 text-center md:text-left">
                            <h1 class="text-xl font-bold text-white tracking-wider hidden md:block">
                                <i class="fas fa-cogs text-blue-500 mr-2"></i>Mantenimiento
                            </h1>
                            <i class="fas fa-cogs text-blue-500 text-xl md:hidden"></i>
                        </div>
                        <nav class="p-2 md:p-4 space-y-2 flex-1">
                            <button onClick={() => setTabActiva('config')} class={`w-full flex items-center justify-center md:justify-start p-3 rounded font-semibold transition ${tabActiva === 'config' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:bg-gray-800'}`}>
                                <i class="fas fa-database md:mr-3"></i> <span class="hidden md:inline">Base de Datos</span>
                            </button>
                            <button onClick={() => setTabActiva('dashboard')} class={`w-full flex items-center justify-center md:justify-start p-3 rounded transition ${tabActiva === 'dashboard' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:bg-gray-800'}`}>
                                <i class="fas fa-chart-line md:mr-3"></i> <span class="hidden md:inline">Dashboard Gerencial</span>
                            </button>
                        </nav>
                    </div>

                    {/* CONTENIDO PRINCIPAL */}
                    <div class="flex-1 flex flex-col overflow-hidden bg-app-dark relative">
                        {/* ALERTA DE EXITO FLOTANTE */}
                        {mensajeExito && (
                            <div class="absolute top-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg flex items-center z-50">
                                <i class="fas fa-check-circle mr-2"></i> {mensajeExito}
                            </div>
                        )}

                        {tabActiva === 'config' ? (
                            <div class="flex-1 flex flex-col h-full">
                                {/* SUB-MENÚ DE CONFIGURACIÓN */}
                                <div class="bg-gray-900 border-b border-gray-800 p-4 flex gap-4">
                                    <button onClick={() => setSubTabConfig('personal')} class={`px-4 py-2 rounded text-sm font-bold transition ${subTabConfig === 'personal' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'}`}>Personal</button>
                                    <button onClick={() => setSubTabConfig('maquinas')} class={`px-4 py-2 rounded text-sm font-bold transition ${subTabConfig === 'maquinas' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'}`}>Máquinas</button>
                                    <button onClick={() => setSubTabConfig('tareas')} class={`px-4 py-2 rounded text-sm font-bold transition ${subTabConfig === 'tareas' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'}`}>Catálogo de Tareas</button>
                                </div>
                                
                                {/* PANTALLA ACTIVA */}
                                <div class="p-6 overflow-y-auto flex-1">
                                    {subTabConfig === 'personal' && renderSeccionPersonal()}
                                    {subTabConfig === 'maquinas' && renderSeccionCargaMasiva('Máquinas / Equipos', 'fa-industry', 'Ejemplo de pegado:\nPrensa Hidráulica 01\nCinta Transportadora B\nRobot Soldador 3...', textoMaquinas, setTextoMaquinas, guardarMaquinasMasivas)}
                                    {subTabConfig === 'tareas' && renderSeccionCargaMasiva('Catálogo de Preventivos', 'fa-clipboard-list', 'Ejemplo de pegado:\nLubricación de rodamientos axiales\nCambio de filtros de aceite\nRevisión de sensores de proximidad...', textoTareas, setTextoTareas, guardarTareasMasivas)}
                                </div>
                            </div>
                        ) : (
                            <div class="p-6 h-full flex flex-col items-center justify-center text-center text-gray-500">
                                <i class="fas fa-chart-pie text-6xl mb-4 text-gray-600"></i>
                                <h2 class="text-2xl font-bold text-gray-300">Motor de Saturación (En desarrollo)</h2>
                                <p class="mt-2 text-sm max-w-md">Una vez que cargues el personal, las máquinas y las tareas, programaremos aquí el cruce de datos para visualizar el porcentaje de ocupación gerencial.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
